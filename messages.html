<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسائل التواصل | Eng.Gad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        lightBg: '#f8fafc',
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-lightBg text-slate-900 dark:bg-darkBg dark:text-white min-h-screen overflow-x-hidden transition-colors duration-500">

    <div class="blob top-0 right-0 animate-pulse"></div>
    <div class="blob bottom-0 left-0" style="animation-delay: 2s;"></div>

    <!-- شريط علوي -->
    <nav class="fixed top-0 w-full z-50 backdrop-blur-lg bg-white/30 dark:bg-black/20 border-b border-gray-200 dark:border-white/10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index_ar.html" class="text-2xl font-black tracking-tighter text-cyan-600 dark:text-cyan-400 hover:opacity-80 transition">Gad Development</a>
            <div class="hidden sm:flex items-center gap-4">
                <a href="add-work.html" class="text-sm font-bold uppercase tracking-widest opacity-70 hover:text-cyan-500 transition">إضافة عمل</a>
                <a href="index_ar.html" class="text-sm font-bold uppercase tracking-widest opacity-70 hover:text-cyan-500 transition">الموقع</a>
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-gray-200 dark:bg-white/10 hover:ring-2 ring-cyan-400 transition-all" aria-label="تبديل الوضع الليلي">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
                    </svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-700 dark:text-gray-300" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
            </div>
            <div class="flex sm:hidden items-center gap-2">
                <button id="theme-toggle-mob" class="p-2.5 rounded-xl bg-gray-200 dark:bg-white/10">
                    <svg id="theme-light-mob" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                    <svg id="theme-dark-mob" class="hidden w-5 h-5 text-gray-700 dark:text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                </button>
                <button type="button" id="nav-mob-toggle" class="p-2.5 rounded-xl bg-gray-200 dark:bg-white/10" aria-label="القائمة">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>
        <div id="nav-mob-menu" class="hidden sm:hidden absolute top-full left-0 right-0 bg-white dark:bg-darkBg border-b border-gray-200 dark:border-white/10 shadow-xl">
            <div class="container mx-auto px-6 py-4 flex flex-col gap-3 text-sm font-bold uppercase tracking-widest opacity-70">
                <a href="add-work.html" class="nav-mob-link block py-2 hover:text-cyan-500 transition">إضافة عمل</a>
                <a href="index.html" class="nav-mob-link block py-2 hover:text-cyan-500 transition">الموقع</a>
            </div>
        </div>
    </nav>

    <div class="relative z-10 container mx-auto px-6 pt-28 pb-16 max-w-4xl">
        <!-- عنوان الصفحة -->
        <header class="mb-10">
            <p class="text-cyan-600 dark:text-cyan-400 font-bold tracking-widest uppercase text-sm mb-2">Portfolio 2026</p>
            <h1 class="text-4xl md:text-5xl font-black tracking-tighter">صندوق <span class="text-cyan-500">الرسائل</span></h1>
            <p class="opacity-60 mt-2">رسائل نموذج التواصل — لك فقط.</p>
        </header>

        <!-- تسجيل الدخول -->
        <div id="login-box" class="max-w-md">
            <div class="bg-white dark:bg-white/5 rounded-3xl p-8 shadow-xl border border-gray-200 dark:border-white/10">
                <p class="opacity-70 mb-6">ادخل بريدك وكلمة المرور (حساب Supabase) لمشاهدة الرسائل.</p>
                <form id="login-form" class="space-y-4">
                    <input type="email" id="login-email" placeholder="البريد الإلكتروني" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <input type="password" id="login-password" placeholder="كلمة المرور" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <p id="login-error" class="text-red-500 text-sm hidden"></p>
                    <button type="submit" id="login-btn"
                        class="w-full py-4 bg-cyan-600 text-white rounded-2xl font-bold hover:bg-cyan-500 shadow-lg shadow-cyan-600/25 hover:shadow-cyan-500/30 transition-all hover:scale-[1.02]">
                        دخول
                    </button>
                </form>
            </div>
        </div>

        <!-- قائمة الرسائل (بعد الدخول) -->
        <div id="messages-box" class="hidden">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
                <h2 class="text-xl font-black opacity-90">الرسائل الواردة</h2>
                <div class="flex items-center gap-3">
                    <button id="refresh-btn" class="px-4 py-2 rounded-xl bg-gray-200 dark:bg-white/10 hover:ring-2 ring-cyan-400 transition-all text-sm font-bold">
                        تحديث
                    </button>
                    <button id="logout-btn" class="px-4 py-2 rounded-xl text-red-500 hover:bg-red-500/10 transition-all text-sm font-bold">
                        تسجيل الخروج
                    </button>
                </div>
            </div>
            <div id="messages-list" class="space-y-5"></div>
            <p id="no-messages" class="text-center opacity-60 py-16 hidden">لا توجد رسائل بعد.</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Dark mode (مثل باقي الموقع)
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');
        if (themeToggleBtn && darkIcon && lightIcon) {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                lightIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.remove('hidden');
            }
            themeToggleBtn.addEventListener('click', function () {
                darkIcon.classList.toggle('hidden');
                lightIcon.classList.toggle('hidden');
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        // قائمة الموبايل + ثيم الموبايل
        (function () {
            var mobToggle = document.getElementById('nav-mob-toggle');
            var mobMenu = document.getElementById('nav-mob-menu');
            if (mobToggle && mobMenu) {
                mobToggle.addEventListener('click', function () { mobMenu.classList.toggle('hidden'); });
                document.querySelectorAll('.nav-mob-link').forEach(function (l) { l.addEventListener('click', function () { mobMenu.classList.add('hidden'); }); });
            }
            var themeMob = document.getElementById('theme-toggle-mob');
            var lightMob = document.getElementById('theme-light-mob');
            var darkMob = document.getElementById('theme-dark-mob');
            function syncMobTheme() {
                var isDark = document.documentElement.classList.contains('dark');
                if (lightMob) lightMob.classList.toggle('hidden', !isDark);
                if (darkMob) darkMob.classList.toggle('hidden', isDark);
            }
            if (themeMob) {
                syncMobTheme();
                themeMob.addEventListener('click', function () {
                    if (document.getElementById('theme-toggle')) document.getElementById('theme-toggle').click();
                    else {
                        document.documentElement.classList.toggle('dark');
                        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                    }
                    syncMobTheme();
                });
            }
        })();

        const supabaseUrl = window.SUPABASE_URL;
        const supabaseKey = window.SUPABASE_ANON_KEY;
        const hasSupabase = supabaseUrl && supabaseKey && !supabaseUrl.includes('YOUR_') && !supabaseKey.includes('YOUR_');

        const loginBox = document.getElementById('login-box');
        const messagesBox = document.getElementById('messages-box');
        const messagesList = document.getElementById('messages-list');
        const noMessages = document.getElementById('no-messages');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const loginBtn = document.getElementById('login-btn');
        const refreshBtn = document.getElementById('refresh-btn');

        let client = null;

        if (hasSupabase && window.supabase) {
            const { createClient } = window.supabase;
            client = createClient(supabaseUrl, supabaseKey);
        }

        function showLogin(err) {
            loginBox.classList.remove('hidden');
            messagesBox.classList.add('hidden');
            if (err) {
                loginError.textContent = err;
                loginError.classList.remove('hidden');
            } else {
                loginError.classList.add('hidden');
            }
        }

        function showMessages() {
            loginBox.classList.add('hidden');
            messagesBox.classList.remove('hidden');
            loadMessages();
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function loadMessages() {
            if (!client) return;
            const { data: user } = await client.auth.getUser();
            if (!user?.user) {
                showLogin('يجب تسجيل الدخول.');
                return;
            }
            if (refreshBtn) refreshBtn.disabled = true;
            const { data, error } = await client.from('contact_messages').select('id, name, email, phone, message, visitor_id, created_at').order('created_at', { ascending: false });
            if (refreshBtn) refreshBtn.disabled = false;
            messagesList.innerHTML = '';
            if (error) {
                noMessages.textContent = 'تعذر تحميل الرسائل. تأكد من تفعيل RLS وربط الجدول بحسابك.';
                noMessages.classList.remove('hidden');
                return;
            }
            if (!data || data.length === 0) {
                noMessages.textContent = 'لا توجد رسائل بعد.';
                noMessages.classList.remove('hidden');
                return;
            }
            noMessages.classList.add('hidden');
            data.forEach(function (row) {
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-white/5 rounded-3xl p-6 border border-gray-200 dark:border-white/10 shadow-sm hover:shadow-lg hover:border-cyan-500/20 transition-all duration-300';
                card.dataset.id = row.id;
                const phoneHtml = row.phone
                    ? '<a href="tel:' + escapeHtml(row.phone) + '" class="text-sm text-cyan-600 dark:text-cyan-400 hover:underline block mb-2">' + escapeHtml(row.phone) + '</a>'
                    : '';
                const visitorBadge = row.visitor_id
                    ? '<span class="text-xs bg-cyan-500/20 text-cyan-600 dark:text-cyan-400 px-2 py-0.5 rounded-full ml-2">زائر معرّف</span>'
                    : '';
                card.innerHTML =
                    '<div class="flex flex-wrap justify-between items-start gap-3 mb-3">' +
                    '<span class="flex items-center gap-2"><span class="text-lg font-black text-cyan-600 dark:text-cyan-400">' + escapeHtml(row.name) + '</span>' + visitorBadge + '</span>' +
                    '<div class="flex items-center gap-2">' +
                    '<span class="text-xs opacity-60">' + formatDate(row.created_at) + '</span>' +
                    '<button type="button" class="msg-delete-btn px-3 py-1 rounded-lg text-red-500 hover:bg-red-500/10 text-xs font-bold transition-all" data-id="' + escapeHtml(row.id) + '" title="حذف الرسالة">حذف</button>' +
                    '</div>' +
                    '</div>' +
                    '<a href="mailto:' + escapeHtml(row.email) + '" class="text-sm text-cyan-600 dark:text-cyan-400 hover:underline block mb-2">' + escapeHtml(row.email) + '</a>' +
                    phoneHtml +
                    '<p class="opacity-90 leading-relaxed whitespace-pre-wrap">' + escapeHtml(row.message) + '</p>';
                messagesList.appendChild(card);
            });
            messagesList.querySelectorAll('.msg-delete-btn').forEach(function (btn) {
                btn.addEventListener('click', function () { deleteMessage(btn.dataset.id, btn.closest('[data-id]')); });
            });
        }

        async function deleteMessage(id, cardEl) {
            if (!client || !id) return;
            if (!confirm('حذف هذه الرسالة من قاعدة البيانات؟')) return;
            const { error } = await client.from('contact_messages').delete().eq('id', id);
            if (error) {
                alert('فشل الحذف: ' + (error.message || 'تأكد من تفعيل صلاحية الحذف (DELETE) في Supabase.'));
                return;
            }
            if (cardEl) {
                cardEl.remove();
                if (messagesList.children.length === 0) {
                    noMessages.textContent = 'لا توجد رسائل بعد.';
                    noMessages.classList.remove('hidden');
                }
                alert('تم حذف الرسالة من قاعدة البيانات.');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        if (!client || !hasSupabase) {
            loginBox.querySelector('form').innerHTML = '<p class="text-amber-600 dark:text-amber-400">يرجى إعداد Supabase في ملف <code class="bg-black/10 dark:bg-white/10 px-1 rounded">config.js</code> ثم إنشاء الجدول وحساب الدخول.</p>';
        } else {
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                loginError.classList.add('hidden');
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                if (loginBtn) {
                    loginBtn.disabled = true;
                    loginBtn.textContent = 'جاري الدخول...';
                }
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'دخول';
                }
                if (error) {
                    loginError.textContent = error.message || 'فشل تسجيل الدخول.';
                    loginError.classList.remove('hidden');
                    return;
                }
                showMessages();
            });

            if (logoutBtn) logoutBtn.addEventListener('click', async function () {
                await client.auth.signOut();
                showLogin();
            });

            if (refreshBtn) refreshBtn.addEventListener('click', loadMessages);

            client.auth.onAuthStateChange(function (event, session) {
                if (session) showMessages();
                else showLogin();
            });

            client.auth.getSession().then(function ({ data: { session } }) {
                if (session) showMessages();
            });
        }
    </script>
</body>

</html>
