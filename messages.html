<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسائل التواصل | Eng.Gad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-lightBg text-slate-900 dark:bg-darkBg dark:text-white min-h-screen transition-colors duration-500">

    <div class="blob top-0 right-0 animate-pulse"></div>
    <div class="blob bottom-0 left-0" style="animation-delay: 2s;"></div>

    <div class="relative z-10 container mx-auto px-6 py-12 max-w-4xl">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-cyan-600 dark:text-cyan-400">صندوق الرسائل</h1>
            <a href="index_ar.html" class="text-sm font-bold uppercase tracking-widest opacity-70 hover:text-cyan-500 transition">العودة للموقع</a>
        </div>

        <!-- تسجيل الدخول -->
        <div id="login-box" class="bg-white dark:bg-white/5 rounded-3xl p-8 shadow-xl border border-gray-200 dark:border-white/10">
            <p class="opacity-70 mb-6">ادخل بريدك وكلمة المرور (حساب Supabase) لمشاهدة الرسائل.</p>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="البريد الإلكتروني" required
                    class="w-full p-4 rounded-2xl bg-gray-50 dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                <input type="password" id="login-password" placeholder="كلمة المرور" required
                    class="w-full p-4 rounded-2xl bg-gray-50 dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                <p id="login-error" class="text-red-500 text-sm hidden"></p>
                <button type="submit"
                    class="w-full py-4 bg-cyan-600 text-white rounded-2xl font-bold hover:bg-cyan-500 shadow-lg shadow-cyan-600/25 transition">
                    دخول
                </button>
            </form>
        </div>

        <!-- قائمة الرسائل (بعد الدخول) -->
        <div id="messages-box" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold opacity-80">الرسائل الواردة</h2>
                <button id="logout-btn" class="text-sm font-bold text-red-500 hover:text-red-400 transition">تسجيل الخروج</button>
            </div>
            <div id="messages-list" class="space-y-4"></div>
            <p id="no-messages" class="text-center opacity-60 py-12 hidden">لا توجد رسائل بعد.</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = window.SUPABASE_URL;
        const supabaseKey = window.SUPABASE_ANON_KEY;
        const hasSupabase = supabaseUrl && supabaseKey && !supabaseUrl.includes('YOUR_') && !supabaseKey.includes('YOUR_');

        const loginBox = document.getElementById('login-box');
        const messagesBox = document.getElementById('messages-box');
        const messagesList = document.getElementById('messages-list');
        const noMessages = document.getElementById('no-messages');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');

        let client = null;

        if (hasSupabase && window.supabase) {
            const { createClient } = window.supabase;
            client = createClient(supabaseUrl, supabaseKey);
        }

        function showLogin(err) {
            loginBox.classList.remove('hidden');
            messagesBox.classList.add('hidden');
            if (err) {
                loginError.textContent = err;
                loginError.classList.remove('hidden');
            } else {
                loginError.classList.add('hidden');
            }
        }

        function showMessages() {
            loginBox.classList.add('hidden');
            messagesBox.classList.remove('hidden');
            loadMessages();
        }

        async function loadMessages() {
            if (!client) return;
            const { data: user } = await client.auth.getUser();
            if (!user?.user) {
                showLogin('يجب تسجيل الدخول.');
                return;
            }
            const { data, error } = await client.from('contact_messages').select('id, name, email, message, created_at').order('created_at', { ascending: false });
            messagesList.innerHTML = '';
            if (error) {
                noMessages.textContent = 'تعذر تحميل الرسائل. تأكد من تفعيل RLS وربط الجدول بحسابك.';
                noMessages.classList.remove('hidden');
                return;
            }
            if (!data || data.length === 0) {
                noMessages.textContent = 'لا توجد رسائل بعد.';
                noMessages.classList.remove('hidden');
                return;
            }
            noMessages.classList.add('hidden');
            data.forEach(function (row) {
                const date = new Date(row.created_at).toLocaleString('ar-EG');
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-white/5 rounded-2xl p-6 border border-gray-200 dark:border-white/10';
                card.innerHTML = '<div class="flex justify-between items-start gap-4 mb-2"><span class="font-bold text-cyan-600 dark:text-cyan-400">' + escapeHtml(row.name) + '</span><span class="text-sm opacity-60">' + date + '</span></div><p class="text-sm opacity-70 mb-2">' + escapeHtml(row.email) + '</p><p class="opacity-90">' + escapeHtml(row.message) + '</p>';
                messagesList.appendChild(card);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        if (!client || !hasSupabase) {
            loginBox.querySelector('form').innerHTML = '<p class="text-amber-600 dark:text-amber-400">يرجى إعداد Supabase في ملف <code>config.js</code> ثم إنشاء الجدول وحساب الدخول.</p>';
        } else {
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                loginError.classList.add('hidden');
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) {
                    loginError.textContent = error.message || 'فشل تسجيل الدخول.';
                    loginError.classList.remove('hidden');
                    return;
                }
                showMessages();
            });

            logoutBtn.addEventListener('click', async function () {
                await client.auth.signOut();
                showLogin();
            });

            client.auth.onAuthStateChange(function (event, session) {
                if (session) showMessages();
                else showLogin();
            });

            client.auth.getSession().then(function ({ data: { session } }) {
                if (session) showMessages();
            });
        }
    </script>
</body>

</html>
