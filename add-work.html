<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة عمل | Eng.Gad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        lightBg: '#f8fafc',
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-lightBg text-slate-900 dark:bg-darkBg dark:text-white min-h-screen overflow-x-hidden transition-colors duration-500">

    <div class="blob top-0 right-0 animate-pulse"></div>
    <div class="blob bottom-0 left-0" style="animation-delay: 2s;"></div>

    <nav class="fixed top-0 w-full z-50 backdrop-blur-lg bg-white/30 dark:bg-black/20 border-b border-gray-200 dark:border-white/10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index_ar.html" class="text-2xl font-black tracking-tighter text-cyan-600 dark:text-cyan-400 hover:opacity-80 transition">Gad Development</a>
            <div class="hidden sm:flex items-center gap-4">
                <a href="messages.html" class="text-sm font-bold uppercase tracking-widest opacity-70 hover:text-cyan-500 transition">الرسائل</a>
                <a href="index_ar.html" class="text-sm font-bold uppercase tracking-widest opacity-70 hover:text-cyan-500 transition">الموقع</a>
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-gray-200 dark:bg-white/10 hover:ring-2 ring-cyan-400 transition-all" aria-label="تبديل الوضع الليلي">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
                    </svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-700 dark:text-gray-300" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
            </div>
            <div class="flex sm:hidden items-center gap-2">
                <button id="theme-toggle-mob" class="p-2.5 rounded-xl bg-gray-200 dark:bg-white/10">
                    <svg id="theme-light-mob" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                    <svg id="theme-dark-mob" class="hidden w-5 h-5 text-gray-700 dark:text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                </button>
                <button type="button" id="nav-mob-toggle" class="p-2.5 rounded-xl bg-gray-200 dark:bg-white/10" aria-label="القائمة">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>
        <div id="nav-mob-menu" class="hidden sm:hidden absolute top-full left-0 right-0 bg-white dark:bg-darkBg border-b border-gray-200 dark:border-white/10 shadow-xl">
            <div class="container mx-auto px-6 py-4 flex flex-col gap-3 text-sm font-bold uppercase tracking-widest opacity-70">
                <a href="messages.html" class="nav-mob-link block py-2 hover:text-cyan-500 transition">الرسائل</a>
                <a href="index_ar.html" class="nav-mob-link block py-2 hover:text-cyan-500 transition">الموقع</a>
            </div>
        </div>
    </nav>

    <div class="relative z-10 container mx-auto px-6 pt-28 pb-16 max-w-4xl">
        <header class="mb-10">
            <p class="text-cyan-600 dark:text-cyan-400 font-bold tracking-widest uppercase text-sm mb-2">Portfolio 2026</p>
            <h1 class="text-4xl md:text-5xl font-black tracking-tighter">إضافة <span class="text-cyan-500">عمل</span></h1>
            <p class="opacity-60 mt-2">أضف مشاريعك لتظهر في قسم أعمالي في الموقع.</p>
        </header>

        <!-- تسجيل الدخول -->
        <div id="login-box" class="max-w-md">
            <div class="bg-white dark:bg-white/5 rounded-3xl p-8 shadow-xl border border-gray-200 dark:border-white/10">
                <p class="opacity-70 mb-6">ادخل بريدك وكلمة المرور (نفس حساب الرسائل) للإضافة.</p>
                <form id="login-form" class="space-y-4">
                    <input type="email" id="login-email" placeholder="البريد الإلكتروني" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <input type="password" id="login-password" placeholder="كلمة المرور" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <p id="login-error" class="text-red-500 text-sm hidden"></p>
                    <button type="submit" id="login-btn"
                        class="w-full py-4 bg-cyan-600 text-white rounded-2xl font-bold hover:bg-cyan-500 shadow-lg shadow-cyan-600/25 hover:shadow-cyan-500/30 transition-all hover:scale-[1.02]">
                        دخول
                    </button>
                </form>
            </div>
        </div>

        <!-- نموذج الإضافة + قائمة الأعمال -->
        <div id="works-box" class="hidden">
            <div class="bg-white dark:bg-white/5 rounded-3xl p-8 shadow-xl border border-gray-200 dark:border-white/10 mb-10">
                <h2 class="text-xl font-black mb-6">عمل جديد</h2>
                <form id="add-work-form" class="space-y-4">
                    <input type="text" id="work-title" placeholder="عنوان المشروع" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <textarea id="work-description" rows="3" placeholder="وصف قصير للمشروع" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition"></textarea>
                    <input type="url" id="work-image" placeholder="رابط صورة المشروع (URL)" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <input type="url" id="work-link" placeholder="رابط المشروع (اختياري)"
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <p id="form-error" class="text-red-500 text-sm hidden"></p>
                    <button type="submit" id="submit-work-btn"
                        class="w-full py-4 bg-cyan-600 text-white rounded-2xl font-bold hover:bg-cyan-500 shadow-lg shadow-cyan-600/25 hover:shadow-cyan-500/30 transition-all hover:scale-[1.02]">
                        إضافة العمل
                    </button>
                </form>
            </div>

            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black opacity-90">أعمالك الحالية</h2>
                <button id="logout-btn" class="px-4 py-2 rounded-xl text-red-500 hover:bg-red-500/10 transition-all text-sm font-bold">تسجيل الخروج</button>
            </div>
            <div id="works-list" class="space-y-4"></div>
            <p id="no-works" class="text-center opacity-60 py-12 hidden">لا توجد أعمال. أضف أول عمل من النموذج أعلاه.</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');
        if (themeToggleBtn && darkIcon && lightIcon) {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                lightIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.remove('hidden');
            }
            themeToggleBtn.addEventListener('click', function () {
                darkIcon.classList.toggle('hidden');
                lightIcon.classList.toggle('hidden');
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        // قائمة الموبايل + ثيم الموبايل
        (function () {
            var mobToggle = document.getElementById('nav-mob-toggle');
            var mobMenu = document.getElementById('nav-mob-menu');
            if (mobToggle && mobMenu) {
                mobToggle.addEventListener('click', function () { mobMenu.classList.toggle('hidden'); });
                document.querySelectorAll('.nav-mob-link').forEach(function (l) { l.addEventListener('click', function () { mobMenu.classList.add('hidden'); }); });
            }
            var themeMob = document.getElementById('theme-toggle-mob');
            var lightMob = document.getElementById('theme-light-mob');
            var darkMob = document.getElementById('theme-dark-mob');
            function syncMobTheme() {
                var isDark = document.documentElement.classList.contains('dark');
                if (lightMob) lightMob.classList.toggle('hidden', !isDark);
                if (darkMob) darkMob.classList.toggle('hidden', isDark);
            }
            if (themeMob) {
                syncMobTheme();
                themeMob.addEventListener('click', function () {
                    if (document.getElementById('theme-toggle')) document.getElementById('theme-toggle').click();
                    else {
                        document.documentElement.classList.toggle('dark');
                        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                    }
                    syncMobTheme();
                });
            }
        })();

        const supabaseUrl = window.SUPABASE_URL;
        const supabaseKey = window.SUPABASE_ANON_KEY;
        const hasSupabase = supabaseUrl && supabaseKey && !supabaseUrl.includes('YOUR_') && !supabaseKey.includes('YOUR_');

        const loginBox = document.getElementById('login-box');
        const worksBox = document.getElementById('works-box');
        const worksList = document.getElementById('works-list');
        const noWorks = document.getElementById('no-works');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const addWorkForm = document.getElementById('add-work-form');
        const formError = document.getElementById('form-error');
        const logoutBtn = document.getElementById('logout-btn');

        let client = null;
        if (hasSupabase && window.supabase) {
            const { createClient } = window.supabase;
            client = createClient(supabaseUrl, supabaseKey);
        }

        function showLogin(err) {
            loginBox.classList.remove('hidden');
            worksBox.classList.add('hidden');
            if (err) {
                loginError.textContent = err;
                loginError.classList.remove('hidden');
            } else {
                loginError.classList.add('hidden');
            }
        }

        function showWorks() {
            loginBox.classList.add('hidden');
            worksBox.classList.remove('hidden');
            loadWorks();
        }

        async function loadWorks() {
            if (!client) return;
            const { data: user } = await client.auth.getUser();
            if (!user?.user) {
                showLogin('يجب تسجيل الدخول.');
                return;
            }
            const { data, error } = await client.from('works').select('id, title, description, image_url, project_link, created_at').order('created_at', { ascending: false });
            worksList.innerHTML = '';
            if (error) {
                noWorks.textContent = 'تعذر تحميل الأعمال. تأكد من إنشاء جدول works في Supabase.';
                noWorks.classList.remove('hidden');
                return;
            }
            if (!data || data.length === 0) {
                noWorks.textContent = 'لا توجد أعمال. أضف أول عمل من النموذج أعلاه.';
                noWorks.classList.remove('hidden');
                return;
            }
            noWorks.classList.add('hidden');
            data.forEach(function (row) {
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-white/5 rounded-2xl p-6 border border-gray-200 dark:border-white/10 flex flex-wrap gap-4 items-center';
                const img = row.image_url ? '<img src="' + row.image_url.replace(/"/g, '&quot;') + '" alt="" class="w-24 h-16 object-cover rounded-xl">' : '';
                card.innerHTML =
                    '<div class="flex-1 min-w-0">' + img + '<h3 class="font-bold text-cyan-600 dark:text-cyan-400 mt-2">' + escapeHtml(row.title) + '</h3><p class="text-sm opacity-70 line-clamp-2">' + escapeHtml(row.description) + '</p></div>' +
                    '<button type="button" data-id="' + row.id + '" class="delete-work px-4 py-2 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500/20 text-sm font-bold">حذف</button>';
                worksList.appendChild(card);
            });
            worksList.querySelectorAll('.delete-work').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    if (confirm('حذف هذا العمل؟')) deleteWork(btn.dataset.id);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function deleteWork(id) {
            if (!client) return;
            const { error } = await client.from('works').delete().eq('id', id);
            if (!error) loadWorks();
        }

        if (!client || !hasSupabase) {
            loginBox.querySelector('form').innerHTML = '<p class="text-amber-600 dark:text-amber-400">يرجى إعداد Supabase في <code class="bg-black/10 dark:bg-white/10 px-1 rounded">config.js</code> وتشغيل سكربت جدول works.</p>';
        } else {
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                loginError.classList.add('hidden');
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const btn = document.getElementById('login-btn');
                if (btn) { btn.disabled = true; btn.textContent = 'جاري الدخول...'; }
                const { error } = await client.auth.signInWithPassword({ email, password });
                if (btn) { btn.disabled = false; btn.textContent = 'دخول'; }
                if (error) {
                    loginError.textContent = error.message || 'فشل تسجيل الدخول.';
                    loginError.classList.remove('hidden');
                    return;
                }
                showWorks();
            });

            logoutBtn.addEventListener('click', async function () {
                await client.auth.signOut();
                showLogin();
            });

            addWorkForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                formError.classList.add('hidden');
                const title = document.getElementById('work-title').value.trim();
                const description = document.getElementById('work-description').value.trim();
                const image_url = document.getElementById('work-image').value.trim();
                const project_link = document.getElementById('work-link').value.trim() || null;
                if (!title || !description || !image_url) {
                    formError.textContent = 'العنوان والوصف ورابط الصورة مطلوبة.';
                    formError.classList.remove('hidden');
                    return;
                }
                const btn = document.getElementById('submit-work-btn');
                if (btn) { btn.disabled = true; btn.textContent = 'جاري الإضافة...'; }
                const { error } = await client.from('works').insert([{ title, description, image_url, project_link }]);
                if (btn) { btn.disabled = false; btn.textContent = 'إضافة العمل'; }
                if (error) {
                    formError.textContent = error.message || 'فشل الإضافة.';
                    formError.classList.remove('hidden');
                    return;
                }
                addWorkForm.reset();
                loadWorks();
            });

            client.auth.onAuthStateChange(function (event, session) {
                if (session) showWorks();
                else showLogin();
            });
            client.auth.getSession().then(function (_ref) {
                var session = _ref.data.session;
                if (session) showWorks();
            });
        }
    </script>
</body>

</html>
