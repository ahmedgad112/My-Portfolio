<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعريف الزائر | Eng.Gad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        lightBg: '#f8fafc',
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-lightBg text-slate-900 dark:bg-darkBg dark:text-white min-h-screen overflow-x-hidden transition-colors duration-500">

    <div class="blob top-0 right-0 animate-pulse"></div>
    <div class="blob bottom-0 left-0" style="animation-delay: 2s;"></div>

    <nav class="fixed top-0 w-full z-50 backdrop-blur-lg bg-white/30 dark:bg-black/20 border-b border-gray-200 dark:border-white/10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black tracking-tighter text-cyan-600 dark:text-cyan-400 hover:opacity-80 transition">Gad Development</a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-sm font-bold uppercase tracking-widest opacity-70 hover:text-cyan-500 transition hidden sm:inline">الموقع</a>
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-gray-200 dark:bg-white/10 hover:ring-2 ring-cyan-400 transition-all" aria-label="تبديل الوضع الليلي">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
                    </svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-700 dark:text-gray-300" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 pt-20 pb-12">
        <div class="w-full max-w-md">
            <header class="text-center mb-10">
                <p class="text-cyan-600 dark:text-cyan-400 font-bold tracking-widest uppercase text-sm mb-2">Portfolio 2026</p>
                <h1 class="text-4xl md:text-5xl font-black tracking-tighter">تعريف <span class="text-cyan-500">الزائر</span></h1>
                <p class="opacity-60 mt-2">عبّر بياناتك مرة واحدة — سنتعرف عليك تلقائياً عند إرسال رسالة من نموذج التواصل.</p>
            </header>

            <div class="bg-white dark:bg-white/5 rounded-3xl p-8 shadow-xl border border-gray-200 dark:border-white/10">
                <form id="visitor-form" class="space-y-4">
                    <input type="text" id="visitor-name" name="name" placeholder="الاسم" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <input type="email" id="visitor-email" name="email" placeholder="البريد الإلكتروني" required
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <input type="tel" id="visitor-phone" name="phone" placeholder="رقم الهاتف (اختياري)"
                        class="w-full p-4 rounded-2xl bg-white dark:bg-darkBg border border-gray-200 dark:border-white/10 focus:ring-2 ring-cyan-500 outline-none transition">
                    <p id="form-error" class="text-red-500 text-sm hidden"></p>
                    <button type="submit" id="submit-btn"
                        class="w-full py-4 bg-cyan-600 text-white rounded-2xl font-bold hover:bg-cyan-500 shadow-lg shadow-cyan-600/25 hover:shadow-cyan-500/30 transition-all hover:scale-[1.02]">
                        حفظ بياناتي
                    </button>
                </form>
                <p class="text-center text-sm opacity-60 mt-6">
                    بعد الحفظ يمكنك
                    <a href="index.html" class="text-cyan-500 hover:underline">إرسال رسالة من نموذج التواصل</a>
                    — ستُملأ بياناتك تلقائياً.
                </p>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        var themeToggleBtn = document.getElementById('theme-toggle');
        var darkIcon = document.getElementById('theme-toggle-dark-icon');
        var lightIcon = document.getElementById('theme-toggle-light-icon');
        if (themeToggleBtn && darkIcon && lightIcon) {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                lightIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.remove('hidden');
            }
            themeToggleBtn.addEventListener('click', function () {
                darkIcon.classList.toggle('hidden');
                lightIcon.classList.toggle('hidden');
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        var supabaseUrl = window.SUPABASE_URL;
        var supabaseKey = window.SUPABASE_ANON_KEY;
        var hasSupabase = supabaseUrl && supabaseKey && !supabaseUrl.includes('YOUR_') && !supabaseKey.includes('YOUR_');

        var form = document.getElementById('visitor-form');
        var formError = document.getElementById('form-error');
        var submitBtn = document.getElementById('submit-btn');

        function saveVisitorLocal(name, email, phone, visitorId) {
            localStorage.setItem('visitorName', name);
            localStorage.setItem('visitorEmail', email);
            localStorage.setItem('visitorPhone', phone || '');
            if (visitorId) localStorage.setItem('visitorId', visitorId);
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            if (formError) formError.classList.add('hidden');
            var name = document.getElementById('visitor-name').value.trim();
            var email = document.getElementById('visitor-email').value.trim();
            var phone = document.getElementById('visitor-phone').value.trim() || null;
            if (!name || !email) {
                if (formError) {
                    formError.textContent = 'الاسم والبريد مطلوبان.';
                    formError.classList.remove('hidden');
                }
                return;
            }
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'جاري الحفظ...';
            }
            var visitorId = null;
            if (hasSupabase && window.supabase) {
                try {
                    var createClient = window.supabase.createClient;
                    var client = createClient(supabaseUrl, supabaseKey);
                    var existing = await client.rpc('get_visitor_by_email_or_phone', { e: email, p: phone || '' });
                    if (existing.data && existing.data.length > 0) {
                        var row = existing.data[0];
                        visitorId = row.id;
                        saveVisitorLocal(row.name || name, row.email || email, row.phone || phone, visitorId);
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'حفظ بياناتي';
                        }
                        alert('أنت مسجّل من قبل بنفس البريد أو رقم الهاتف. تم تفعيل بياناتك — يمكنك إرسال رسالة من نموذج التواصل.');
                        window.location.href = 'index.html#contact';
                        return;
                    }
                    var result = await client.from('visitors').insert([{ name: name, email: email, phone: phone }]).select('id').single();
                    if (result.data && result.data.id) visitorId = result.data.id;
                } catch (err) {
                    console.warn('Supabase visitors failed', err);
                }
            }
            saveVisitorLocal(name, email, phone, visitorId);
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'حفظ بياناتي';
            }
            alert('تم حفظ بياناتك. عند إرسال رسالة من نموذج التواصل سيتم التعرف عليك تلقائياً.');
            window.location.href = 'index.html#contact';
        });
    </script>
</body>

</html>
